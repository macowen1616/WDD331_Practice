<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scroll Driven Animations</title>
  <link rel="stylesheet" href="scroll-driven.css">
</head>
<body>

  <!-- Scroll Progress Bar (scroll()) -->
  <div class="scroll-progress-bar"></div>

  <header class="hero">
    <h1>Scroll Driven Animations</h1>
    <p>Scroll down to see view() and scroll() timelines in action.</p>
  </header>

  <main class="content">

    <section class="spacer">
      <p>Keep scrolling ↓</p>
    </section>

    <!-- VIEW() CARDS -->
    <section class="card-grid">

      <article class="reveal-card">Card One</article>
      <article class="reveal-card">Card Two</article>
      <article class="reveal-card">Card Three</article>
      <article class="reveal-card">Card Four</article>

    </section>

    <section class="spacer">
      <p>You’re almost there…</p>
    </section>

  </main>

</body>
</html>
